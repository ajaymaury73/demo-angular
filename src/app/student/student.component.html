<div class="container mt-4">
    <h1 class="text-center text-primary">Student Management System</h1>
  
    <!-- Student Form -->
    <div class="card p-4 shadow-sm form-container">
      <div class="row">
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Student Name" [(ngModel)]="newStudent.name">
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Age" [(ngModel)]="newStudent.age">
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Class" [(ngModel)]="newStudent.className">
        </div>
        <div class="col-md-12 text-center mt-3">
          <button class="btn btn-primary me-2" (click)="addStudent(newStudent)">Save Student</button>
          <button class="btn btn-success" >Print List</button>
        </div>
      </div>
    </div>
  
    <!-- Display Student List in Cards -->
    <div class="row student-list">
      <div class="col-md-4 mt-3" *ngFor="let student of students">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h5 class="card-title">{{ student.name }}</h5>
            <p class="card-text">Class: {{ student.className}}</p>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Print Section -->
    <div class="print-section mt-4">
      <h3 class="text-center text-primary">Student List</h3>
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Class</th>
            <th>Image</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let student of students">
            <td>{{ student.name }}</td>
            <td>{{ student.className }}</td>
            <td>{{student.age}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
